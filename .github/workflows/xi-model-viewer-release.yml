name: xi-model-viewer-release

run-name: xi-model-viewer ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 (no leading v).
        required: true
        type: string
      dry_run:
        description: Build and verify everything, then stop without creating or touching a release.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: xi-model-viewer-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build the Windows exe
    # Build.bat produces a Windows exe via MSVC, so this cannot run on ubuntu.
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      exe_bytes: ${{ steps.stage.outputs.exe_bytes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          version="${version#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([._-].+)?$ ]]; then
            echo "::error::Invalid version '${version}'. Expected MAJOR.MINOR.PATCH."
            exit 1
          fi

          tag_name="v${version}"

          echo "version=${version}"                                >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}"                              >> "$GITHUB_OUTPUT"

      - name: Stamp version into the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.release.outputs.version }}'

          # tauri.conf.json is what the built exe reports, and Cargo.toml keeps the
          # crate in step with it. Only touched on the runner -- nothing is committed
          # back, so the repo stays on whatever version it had.
          #
          # Guard on the match, not on whether the text changed: releasing the
          # version the repo already carries rewrites the field to itself, which is
          # a no-op, not a missing field. The Cargo.toml pattern also avoids a `$`
          # anchor, which never matches if the runner checks the file out with CRLF.
          # Read/write through .NET so the bytes do not ride on the host shell's
          # default encoding -- a BOM breaks serde_json, and Cargo.toml has non-ASCII.
          $utf8 = [Text.UTF8Encoding]::new($false)

          $conf = (Resolve-Path 'src-tauri/tauri.conf.json').Path
          $raw = [IO.File]::ReadAllText($conf)
          $rx = [regex]::new('("version"\s*:\s*")[^"]*(")')
          if (-not $rx.IsMatch($raw)) { throw "Could not find a version field in $conf" }
          [IO.File]::WriteAllText($conf, $rx.Replace($raw, "`${1}$version`${2}", 1), $utf8)

          $toml = (Resolve-Path 'src-tauri/Cargo.toml').Path
          $raw = [IO.File]::ReadAllText($toml)
          $rx = [regex]::new('(?m)^(version\s*=\s*")[^"]*(")')
          if (-not $rx.IsMatch($raw)) { throw "Could not find a version field in $toml" }
          [IO.File]::WriteAllText($toml, $rx.Replace($raw, "`${1}$version`${2}", 1), $utf8)

          Write-Host "Stamped version $version"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Build.bat hunts for RC.EXE via vswhere/vcvars64 because tauri-winres needs
      # it to embed the icon and version resources. This is the CI equivalent.
      - name: Load MSVC environment (puts RC.EXE on PATH)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      # The lists belong to xi-tools, and the app pulls them from there at runtime
      # anyway — so bake whatever is current at build time rather than whatever
      # was last copied into this repo by hand. A fresh install is then already
      # up to date on first launch instead of downloading 12 MB before it can
      # show anything, and the manifest compiled into the binary
      # (include_str! in src-tauri/src/lists.rs) describes the lists actually
      # shipped beside it.
      #
      # A fetch failure is not fatal: the copy committed here is a valid, if
      # older, set and the runtime updater closes the gap on first boot. A
      # manifest that disagrees with the files it arrived with IS fatal — that
      # would ship a binary claiming hashes it does not have, and every client
      # would re-download every list on every boot forever.
      - name: Bake the current DAT lists from xi-tools
        shell: bash
        run: |
          set -uo pipefail
          tmp=$(mktemp -d)
          repo=https://github.com/vekien/xi-tools.git
          # Blobless + sparse: mv/lists is ~12 MB and the rest of xi-tools is not
          # wanted at all, so this pulls the lists and almost nothing else.
          ok=1
          git clone --depth 1 --filter=blob:none --sparse "$repo" "$tmp" || ok=0
          if [ "$ok" = 1 ]; then
            git -C "$tmp" sparse-checkout set mv/lists || ok=0
          fi
          if [ "$ok" = 0 ] || [ ! -f "$tmp/mv/lists/manifest.json" ]; then
            echo "::warning::Could not read xi-tools/mv/lists; baking the lists committed here."
            exit 0
          fi
          cp "$tmp/mv/lists"/*.json ui/public/lists/
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          d = Path("ui/public/lists")
          m = json.loads((d / "manifest.json").read_text(encoding="utf-8"))
          bad = []
          for name, want in (m.get("files") or {}).items():
              f = d / name
              if not f.is_file():
                  bad.append(f"{name}: missing")
                  continue
              got = hashlib.sha256(f.read_bytes()).hexdigest()
              if got != want.get("sha256"):
                  bad.append(f"{name}: {got[:12]} != {str(want.get('sha256'))[:12]}")
          if bad:
              print("::error::Baked lists do not match xi-tools' manifest: " + "; ".join(bad))
              sys.exit(1)
          total = sum(f["bytes"] for f in m["files"].values())
          print(f"Baked {len(m['files'])} lists from xi-tools, {total / 1e6:.1f} MB, "
                f"generated {m.get('generated')}")
          PY

      # Build.bat runs `cargo tauri build`, which needs `cargo install tauri-cli`
      # (several minutes, every run). The npm CLI is the same tool and installs in
      # seconds. `tauri build` still runs beforeBuildCommand (npm run build) and
      # embeds ui/dist, so the exe does not need a dev server -- the whole point of
      # using tauri build over plain `cargo build`.
      - name: Build release executable
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --no-bundle

      # The exe ships on its own. vgmstream is compiled into it (include_bytes! in
      # src-tauri/src/main.rs) and unpacks itself to %LOCALAPPDATA%\XiModelViewer
      # on first use, so nothing needs to sit next to it -- and find_vgmstream()
      # prefers a co-located vgmstream/ folder over the embedded copy, so shipping
      # one would only shadow the self-extracting path.
      - name: Verify build output
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'src-tauri/target/release/xi-model-viewer.exe'
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }

          $size = (Get-Item $exe).Length
          "exe_path=$exe"   >> $env:GITHUB_OUTPUT
          "exe_bytes=$size" >> $env:GITHUB_OUTPUT
          Write-Host "Built $exe ($([math]::Round($size / 1MB, 1)) MB)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xi-model-viewer-release
          path: ${{ steps.stage.outputs.exe_path }}
          if-no-files-found: error

  # The Linux half, called with the version being cut so the packages carry it.
  # That workflow starts no other way — cutting a release is the only thing that
  # justifies four distro containers. Runs alongside the Windows job rather than
  # after it: both validate the version the same way, so neither needs the
  # other's answer.
  linux:
    name: Linux
    uses: ./.github/workflows/xi-model-viewer-linux.yml
    with:
      version: ${{ inputs.version }}

  # One release, made once, with every platform on it. Nothing is published
  # until Windows has built and the Linux packages have been installed and
  # opened on each distro — a half-released version is worse than a late one.
  release:
    name: Publish the release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Collect every platform's artifact
        uses: actions/download-artifact@v4
        with:
          # Both jobs upload into this run; merge-multiple flattens them into
          # one directory rather than one subdirectory each.
          pattern: xi-model-viewer-*
          merge-multiple: true
          path: dist

      - name: Checksum the lot
        id: assets
        run: |
          set -euo pipefail
          cd dist
          # Named, not globbed as `*`, so the file cannot end up listing itself.
          sha256sum xi-model-viewer* > SHA256SUMS
          ls -l
          echo "---"
          cat SHA256SUMS

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.windows.outputs.tag_name }}
          name: XI Model Viewer v${{ needs.windows.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.windows.outputs.tag_name }}"
          {
            echo "## XI Model Viewer v${{ needs.windows.outputs.version }}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${{ needs.windows.outputs.version }}\` |"
            echo "| Tag | \`${{ needs.windows.outputs.tag_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "| Asset | Size |"
            echo "| --- | --- |"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(numfmt --to=iec-i --suffix=B "$(stat -c%s "$f")") |"
            done
            echo ""
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "**Dry run** — everything above was built and verified, and no release was created or touched."
            else
              echo "[View release]($release_url)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
